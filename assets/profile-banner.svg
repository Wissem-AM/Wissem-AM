    <text x="78" y="153" fill="#f0f7fa" font-size="54" font-weight="700" letter-spacing="-1">Build with care.</text>
    <text x="82" y="196" fill="#9fb8c7" font-size="21">Secure thinking. Practical development. Always learning.</text>
